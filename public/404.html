<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GILEN Industrial | Redirecionando...</title>
  <script>
    // SPA redirect for hosts that serve 404.html
    var path = location.pathname;
    var search = location.search;
    var hash = location.hash;
    
    // Support for domain-in-path URLs (cleaning malformed links)
    var domains = ["gilen.com.br", "gil.com.br", "gilenindustrial.com.br", "www.gilen.com.br"];
    for (var i = 0; i < domains.length; i++) {
      var domain = domains[i];
      if (path.indexOf(domain) !== -1) {
        path = path.split(domain)[1] || "/";
        break;
      }
    }
    
    // Check if we are already at root to avoid infinite loops
    if (path === "/" && !search && !hash) {
      location.replace('/');
    } else {
      sessionStorage.redirect = path + search + hash;
      location.replace('/');
    }
  </script>
</head>
<body>
  <p>Carregando...</p>
</body>
</html>
