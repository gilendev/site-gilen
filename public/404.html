<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GILEN Industrial | Redirecionando...</title>
  <script>
    // SPA redirect for hosts that serve 404.html (like GitHub Pages or others)
    // It stores the current URL and redirects to the home page, where index.html
    // will pick up the path and restore it in the router.
    var path = location.pathname;
    var search = location.search;
    var hash = location.hash;
    
    // Support for domain-in-path URLs
    var domains = ["gilen.com.br", "gil.com.br", "gilenindustrial.com.br", "www.gilen.com.br"];
    for (var i = 0; i < domains.length; i++) {
      var domain = domains[i];
      if (path.indexOf(domain) !== -1) {
        path = path.split(domain)[1] || "/";
        break;
      }
    }
    
    sessionStorage.redirect = path + search + hash;
    location.replace('/');
  </script>
</head>
<body>
  <p>Carregando...</p>
</body>
</html>
