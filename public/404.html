<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>GILEN Industrial | Redirecionando...</title>
  <script type="text/javascript">
    // SPA redirect logic
    var path = window.location.pathname;
    var search = window.location.search;
    var hash = window.location.hash;

    // Clean malformed links containing domain names in the path
    var domains = ["gilen.com.br", "gil.com.br", "gilenindustrial.com.br", "www.gilen.com.br"];
    for (var i = 0; i < domains.length; i++) {
      if (path.indexOf(domains[i]) !== -1) {
        path = path.split(domains[i])[1] || "/";
        break;
      }
    }

    // Ensure path starts with /
    if (!path || path === "") path = "/";
    if (path.charAt(0) !== "/") path = "/" + path;

    // Save intended path and redirect to home
    sessionStorage.redirect = path + search + hash;
    window.location.replace('/');
  </script>
</head>
<body>
  <p>Redirecionando para a página solicitada...</p>
</body>
</html>
